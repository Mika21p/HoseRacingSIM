name: Deploy website to Tencent COS

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - css/**
      - js/**
      - package.json
      - scripts/build-web.js
      - tests/**
      - .github/workflows/deploy-cos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test website source
        run: npm test

      - name: Build website
        run: npm run build:web

      - name: Install COSCLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64 \
            --output coscli
          chmod +x coscli

      - name: Upload website files
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          # COSCLI's first run is interactive. Seed its configuration file so
          # the following commands receive the GitHub Secrets non-interactively.
          printf '%s\n' \
            'cos:' \
            '  base:' \
            '    secretid: ""' \
            '    secretkey: ""' \
            '    sessiontoken: ""' \
            '    mode: SecretKey' \
            '    protocol: https' \
            '  buckets: []' \
            > "$HOME/.cos.yaml"

          ./coscli config set \
            --secret_id "$TENCENT_SECRET_ID" \
            --secret_key "$TENCENT_SECRET_KEY"
          ./coscli config add \
            --alias website \
            --bucket "$COS_BUCKET" \
            --region "$COS_REGION"

          ./coscli sync dist/ cos://website/ --recursive --force
