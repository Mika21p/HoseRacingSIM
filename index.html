<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛马生涯模拟</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="changelog-widget">
    <button class="secondary changelog-toggle" id="changelogToggleBtn" type="button" aria-expanded="false">更新日志</button>
    <section class="changelog-panel" id="changelogPanel" hidden>
      <div class="changelog-header">
        <p class="eyebrow">更新日志</p>
        <button class="secondary changelog-close" id="changelogCloseBtn" type="button">关闭</button>
      </div>
      <div id="changelogContent"></div>
    </section>
  </div>
  <main class="app-shell" id="app"></main>

  <script src="js/utils/random.js"></script>
  <script src="js/data/bloodlines.js"></script>
  <script src="js/data/jockeys.js"></script>
  <script src="js/data/races.js"></script>
  <script src="js/data/opponents.js"></script>
  <script src="js/data/help.js"></script>
  <script src="js/data/changelog.js"></script>
  <script src="js/data/historical-horses/registry.js"></script>
  <script src="js/data/historical-horses/index.js"></script>
  <script src="js/rules/time.js"></script>
  <script src="js/rules/race-progression.js"></script>
  <script src="js/rules/debut-lock.js"></script>
  <script src="js/rules/maturity.js"></script>
  <script src="js/rules/temperament.js"></script>
  <script src="js/rules/jockey-rules.js"></script>
  <script src="js/rules/horse-generator.js"></script>
  <script src="js/rules/historical-opponents.js"></script>
  <script src="js/rules/race-simulator.js"></script>
  <script src="js/rules/comments.js"></script>
  <script src="js/rules/career.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
